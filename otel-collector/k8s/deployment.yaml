apiVersion: v1
kind: ConfigMap
metadata:
  name: fcg-otel-collector-config
data:
  otel-collector-config.yml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch:
        timeout: 1s
        send_batch_size: 1024
      resource:
        attributes:
          - key: service.namespace
            value: fcg
            action: upsert
    exporters:
      otlp/tempo:
        endpoint: fcg-tempo:4317
        tls:
          insecure: true
      otlphttp/loki:
        endpoint: http://fcg-loki:3100/otlp
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch, resource]
          exporters: [otlp/tempo]
        logs:
          receivers: [otlp]
          processors: [batch, resource]
          exporters: [otlphttp/loki]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fcg-otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fcg-otel-collector
  template:
    metadata:
      labels:
        app: fcg-otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.111.0
          args: ["--config=/etc/otel-collector-config.yml"]
          ports:
            - containerPort: 4317
            - containerPort: 4318
          volumeMounts:
            - name: config
              mountPath: /etc/otel-collector-config.yml
              subPath: otel-collector-config.yml
      volumes:
        - name: config
          configMap:
            name: fcg-otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: fcg-otel-collector
spec:
  selector:
    app: fcg-otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
  type: ClusterIP
