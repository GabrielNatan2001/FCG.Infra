apiVersion: v1
kind: ConfigMap
metadata:
  name: fcg-prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: fcg-users-api
        metrics_path: /metrics
        static_configs:
          - targets:
              - fcg-users-api:80
            labels:
              service: users-api

      - job_name: fcg-catalog-api
        metrics_path: /metrics
        static_configs:
          - targets:
              - fcg-catalog-api:80
            labels:
              service: catalog-api
