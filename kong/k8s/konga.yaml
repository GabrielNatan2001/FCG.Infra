apiVersion: apps/v1
kind: Deployment
metadata:
  name: fcg-konga
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fcg-konga
  template:
    metadata:
      labels:
        app: fcg-konga
    spec:
      containers:
        - name: konga
          image: pantsel/konga:0.14.9
          ports:
            - containerPort: 1337
          env:
            # Development + emptyDir: evita SCRAM do Postgres 14+ (Konga usa pg antigo).
            - name: NODE_ENV
              value: development
            - name: TOKEN_SECRET
              value: fcg-konga-dev-secret
          volumeMounts:
            - name: konga-data
              mountPath: /app/kongadata
      volumes:
        - name: konga-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: fcg-konga
spec:
  selector:
    app: fcg-konga
  ports:
    - name: http
      port: 1337
      targetPort: 1337
      nodePort: 31337
  type: NodePort
