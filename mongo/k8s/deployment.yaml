apiVersion: apps/v1
kind: Deployment
metadata:
  name: fcg-mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fcg-mongodb
  template:
    metadata:
      labels:
        app: fcg-mongodb
    spec:
      containers:
        - name: fcg-mongodb
          image: mongo:7
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: fcg-mongodb-data
              mountPath: /data/db
      volumes:
        - name: fcg-mongodb-data
          emptyDir: {}
