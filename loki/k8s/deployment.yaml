apiVersion: v1
kind: ConfigMap
metadata:
  name: fcg-loki-config
data:
  loki-config.yml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2020-10-24
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      allow_structured_metadata: true
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      volume_enabled: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fcg-loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fcg-loki
  template:
    metadata:
      labels:
        app: fcg-loki
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.1.1
          args: ["-config.file=/etc/loki/loki-config.yml"]
          ports:
            - containerPort: 3100
          volumeMounts:
            - name: config
              mountPath: /etc/loki
      volumes:
        - name: config
          configMap:
            name: fcg-loki-config
---
apiVersion: v1
kind: Service
metadata:
  name: fcg-loki
spec:
  selector:
    app: fcg-loki
  ports:
    - name: http
      port: 3100
      targetPort: 3100
      nodePort: 30310
  type: NodePort
