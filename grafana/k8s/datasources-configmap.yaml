apiVersion: v1
kind: ConfigMap
metadata:
  name: fcg-grafana-datasources
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://fcg-prometheus:9090
        isDefault: true
        uid: prometheus
        editable: true
        jsonData:
          timeInterval: 15s
          httpMethod: POST
      - name: Loki
        type: loki
        access: proxy
        url: http://fcg-loki:3100
        uid: loki
        editable: true
        jsonData:
          maxLines: 1000
          derivedFields:
            - name: TraceID
              matcherRegex: '"[Tt]race[Ii][Dd]":"([a-fA-F0-9]+)"'
              url: "$${__value.raw}"
              datasourceUid: tempo
              urlDisplayLabel: View Trace
      - name: Tempo
        type: tempo
        access: proxy
        url: http://fcg-tempo:3200
        uid: tempo
        editable: true
        jsonData:
          httpMethod: GET
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: "-1h"
            spanEndTimeShift: "1h"
            filterByTraceID: true
            filterBySpanID: false
          lokiSearch:
            datasourceUid: loki
          nodeGraph:
            enabled: true
