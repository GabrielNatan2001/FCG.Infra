apiVersion: v1
kind: ConfigMap
metadata:
  name: fcg-tempo-config
data:
  tempo-config.yml: |
    server:
      http_listen_port: 3200
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
    ingester:
      max_block_duration: 5m
    compactor:
      compaction:
        block_retention: 48h
    storage:
      trace:
        backend: local
        wal:
          path: /tmp/tempo/wal
        local:
          path: /tmp/tempo/blocks
    overrides:
      defaults:
        metrics_generator:
          processors: []
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fcg-tempo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fcg-tempo
  template:
    metadata:
      labels:
        app: fcg-tempo
    spec:
      containers:
        - name: tempo
          image: grafana/tempo:2.5.0
          args: ["-config.file=/etc/tempo/tempo-config.yml"]
          ports:
            - containerPort: 3200
            - containerPort: 4317
            - containerPort: 4318
          volumeMounts:
            - name: config
              mountPath: /etc/tempo
      volumes:
        - name: config
          configMap:
            name: fcg-tempo-config
---
apiVersion: v1
kind: Service
metadata:
  name: fcg-tempo
spec:
  selector:
    app: fcg-tempo
  ports:
    - name: http
      port: 3200
      targetPort: 3200
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
  type: ClusterIP
