name: fcg

services:
  postgres:
    image: postgres:17
    container_name: fcg-postgres
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - fcg-postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

  rabbitmq:
    image: rabbitmq:4-management
    container_name: fcg-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - fcg-rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro

  mongodb:
    image: mongo:7
    container_name: fcg-mongodb
    ports:
      - "27017:27017"
    volumes:
      - fcg-mongodb-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: fcg-redis
    ports:
      - "6379:6379"

  loki:
    image: grafana/loki:3.1.1
    container_name: fcg-loki
    command: ["-config.file=/etc/loki/loki-config.yml"]
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - fcg-loki-data:/loki
    restart: unless-stopped

  # O Tempo roda como uid 10001 e o volume nomeado nasce pertencendo ao root.
  tempo-init:
    image: grafana/tempo:2.5.0
    container_name: fcg-tempo-init
    user: root
    entrypoint: ["chown", "-R", "10001:10001", "/var/tempo"]
    volumes:
      - fcg-tempo-data:/var/tempo

  tempo:
    image: grafana/tempo:2.5.0
    container_name: fcg-tempo
    command: ["-config.file=/etc/tempo/tempo-config.yml"]
    ports:
      - "3200:3200"
    volumes:
      - ./tempo/tempo-config.yml:/etc/tempo/tempo-config.yml:ro
      - fcg-tempo-data:/var/tempo
    depends_on:
      tempo-init:
        condition: service_completed_successfully
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: fcg-otel-collector
    command: ["--config=/etc/otel-collector-config.yml"]
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./otel-collector/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    depends_on:
      - loki
      - tempo
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: fcg-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - users-api
      - catalog-api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: fcg-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped

  kong:
    image: kong:3.8
    container_name: fcg-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro
    ports:
      - "8000:8000"
      - "8001:8001"
    depends_on:
      - users-api
      - catalog-api
    restart: unless-stopped

  payments-worker:
    image: gabrielnatan2001/fcg-worker-payments:latest
    pull_policy: always
    container_name: fcg-payments-worker
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=fcg_payments;Username=postgres;Password=postgres
      MessageBusConfigs__Host: amqp://admin:admin@rabbitmq:5672/
      MessageBusConfigs__RetryCount: "5"
      Workers__OrderPlaced__Ativo: "true"
      Workers__OrderPlaced__Exchange: fcg.order.placed
      Workers__OrderPlaced__RoutingKey: payments.order-placed
      Publishers__PaymentProcessed__Exchange: fcg.payment.processed
      Publishers__PaymentProcessed__CatalogRoutingKey: catalog.payment-processed
      Publishers__PaymentProcessed__NotificationsRoutingKey: notifications.payment-processed
    depends_on:
      - postgres
      - rabbitmq
    restart: unless-stopped

  catalog-worker:
    image: gabrielnatan2001/fcg-worker-catalog:latest
    pull_policy: always
    container_name: fcg-catalog-worker
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=fcg_catalog;Username=postgres;Password=postgres
      MessageBusConfigs__Host: amqp://admin:admin@rabbitmq:5672/
      MessageBusConfigs__RetryCount: "5"
      Workers__PaymentProcessed__Ativo: "true"
      Workers__PaymentProcessed__Exchange: fcg.payment.processed
      Workers__PaymentProcessed__RoutingKey: catalog.payment-processed
    depends_on:
      - postgres
      - rabbitmq
    restart: unless-stopped

  catalog-api:
    build:
      context: ../FCG.Catalog
      dockerfile: Dockerfile
    image: gabrielnatan2001/fcg-api-catalog:latest
    pull_policy: missing
    container_name: fcg-catalog-api
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=fcg_catalog;Username=postgres;Password=postgres
      ConnectionStrings__MongoDB: mongodb://mongodb:27017
      ConnectionStrings__Redis: redis:6379
      MongoDB__Database: fcg_catalog
      Cache__JogosTtlSeconds: "60"
      MessageBusConfigs__Host: amqp://admin:admin@rabbitmq:5672/
      MessageBusConfigs__RetryCount: "5"
      Publishers__OrderPlaced__Exchange: fcg.order.placed
      Publishers__OrderPlaced__RoutingKey: payments.order-placed
      Jwt__Key: "rN8#kL2vQ9@xT5mP1!zC7$$dH4^bW6&yU"
      Jwt__Issuer: FCG.Users.API
      Jwt__Audience: FCG.Client
      OTEL_SERVICE_NAME: fcg-catalog-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    depends_on:
      - postgres
      - rabbitmq
      - mongodb
      - redis
      - otel-collector
    restart: unless-stopped

  users-api:
    build:
      context: ../FCG.Users
      dockerfile: Dockerfile
    image: gabrielnatan2001/fcg-api-users:latest
    pull_policy: missing
    container_name: fcg-users-api
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=fcg_users;Username=postgres;Password=postgres
      MessageBusConfigs__Host: amqp://admin:admin@rabbitmq:5672/
      MessageBusConfigs__RetryCount: "5"
      Publishers__UserCreated__Exchange: fcg.user.created
      Publishers__UserCreated__RoutingKey: notifications.user-created
      Jwt__Key: "rN8#kL2vQ9@xT5mP1!zC7$$dH4^bW6&yU"
      Jwt__Issuer: FCG.Users.API
      Jwt__Audience: FCG.Client
      OTEL_SERVICE_NAME: fcg-users-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    depends_on:
      - postgres
      - rabbitmq
      - otel-collector
    restart: unless-stopped

volumes:
  fcg-postgres-data:
  fcg-rabbitmq-data:
  fcg-mongodb-data:
  fcg-loki-data:
  fcg-tempo-data:
